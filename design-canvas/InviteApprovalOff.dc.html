<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
    /* ── Little Sprout M1 tokens（值即實作值，ios-dev 直接抄）── */
    :root{
      --ls-board:#EFE3D0; --ls-board-2:#E3D2B8; --ls-board-3:#D9C7AB; --ls-lit:#FBF4E8;
      --ls-ink:#241A12; --ls-ink-2:#413327;
      --ls-cta:#8A3016; --ls-cta-deep:#6B2410; --ls-on-cta:#FFFFFF;
      --ls-wine:#6E1424; --ls-sprout:#1F5230; --ls-edge:#7D6342;
      --ls-r-window:12px; --ls-r-control:14px; --ls-r-card:18px;
      --ls-sp-1:4px; --ls-sp-2:8px; --ls-sp-3:12px; --ls-sp-4:16px;
      --ls-sp-5:24px; --ls-sp-6:32px; --ls-tap-min:44px;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;-webkit-font-smoothing:antialiased;background:#EFE3D0;color:#241A12;text-wrap:pretty}
    a{color:#241A12;text-decoration:underline} a:hover{color:#8A3016}
    /* 紙的紋理：卡紙不是純色。全稿唯一用到透明度的地方。 */
    .g::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      mix-blend-mode:multiply}
  </style></helmet>
<div class="g" data-col="phone" style="position:relative;width:390px;height:844px;background:#EFE3D0;overflow:hidden;display:flex;flex-direction:column">
  <div style="padding:59px 24px 0"><div data-s="raise" data-role="link" style="min-height:44px;display:flex;align-items:center;gap:4px;margin-left:-6px;color:#241A12">
      <span style="display:flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5 8 12l6.5 7"/></svg></span><span style="font-size:17px;line-height:25px;font-weight:600">陳家</span>
   </div></div>
  <div style="display:flex;flex-direction:column;gap:8px;padding:16px 24px 0">
    <h1 style="font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.01em;color:#241A12;margin:0">邀請家人</h1>
    <p style="font-size:17px;line-height:25px;font-weight:400;color:#413327;margin:0">號碼有期限，也有可用次數。</p>
  </div>
<div style="display:flex;flex-direction:column;gap:24px;padding:24px 24px 34px;flex-grow:1">
      <div data-s="raise" data-role="toggleRow" style="background:#D9C7AB;border-radius:14px;border-bottom:3px solid #6E1424;box-shadow:0 1px 0 rgba(36,26,18,.20), 0 8px 16px -10px rgba(36,26,18,.55);padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:16px;align-items:flex-start">
        <div style="flex-grow:1;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:17px;line-height:25px;font-weight:600;color:#241A12">新成員要我核准才能進來</span>
          <span style="font-size:13px;line-height:18px;font-weight:500;color:#413327">現在是關掉的。</span>
        </div>
        <div data-s="win" data-role="switchOff" data-m="switch" style="flex:none;width:56px;height:32px;border-radius:999px;background:#E3D2B8;border:1px solid #7D6342;box-shadow:inset 0 2px 4px -1px rgba(36,26,18,.22);display:flex;align-items:center;justify-content:flex-start;padding:3px">
         <div style="width:26px;height:26px;border-radius:50%;background:#D9C7AB;border:1px solid #7D6342"></div></div>
      </div>
      <div style="border-top:1px solid #7D6342;padding-top:12px">
           <span style="font-size:17px;line-height:25px;font-weight:600;color:#6E1424">任何拿到號碼的人都能直接看到照片。</span></div>
    </div>
      
  <div data-s="flat" data-m="ticket" style="border:1px solid #7D6342;border-radius:18px;padding:0;overflow:hidden">
    <div style="padding:24px;display:flex;flex-direction:column;align-items:center;gap:12px">
      <span style="font-size:13px;line-height:18px;font-weight:500;color:#413327;letter-spacing:.16em;text-shadow:0 1px 0 rgba(255,250,238,.75)">邀 請 碼</span>
      <span style="display:flex;gap:24px;font-family:ui-monospace, 'SF Mono', 'SFMono-Regular', Menlo, monospace;font-variant-numeric:tabular-nums;font-size:60px;line-height:64px;font-weight:600;letter-spacing:.04em;color:#241A12;text-shadow:0 1px 0 rgba(255,250,238,.75)"><span>742</span><span>936</span></span>
    </div>
    <div style="height:1px;background:repeating-linear-gradient(90deg,#7D6342 0 6px,transparent 6px 12px)"></div>
    <div style="padding:12px 24px;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#D9C7AB">
      <span style="font-size:13px;line-height:18px;font-weight:500;color:#413327;text-shadow:0 1px 0 rgba(255,250,238,.75)">有效到 8 月 30 日</span>
      <span style="font-size:13px;line-height:18px;font-weight:500;color:#413327;text-shadow:0 1px 0 rgba(255,250,238,.75)">還可以用 3 次</span>
    </div>
  </div>
      <div data-s="raise" data-role="button" style="background:#D9C7AB;border-radius:14px;border-bottom:3px solid #7D6342;box-shadow:0 1px 0 rgba(36,26,18,.20), 0 8px 16px -10px rgba(36,26,18,.55);min-height:56px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px;color:#241A12">
      <span style="display:flex;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 3.4 3.6 10.2l6.6 2.8 2.8 6.6Z"/><path d="m10.2 13 4.2-4.2"/></svg></span>
      <span style="font-size:17px;line-height:25px;font-weight:600;color:#241A12;text-align:center">還是要傳給家人</span>
    </div>
      <div data-s="raise" data-role="button" style="background:#D9C7AB;border-radius:14px;border-bottom:3px solid #7D6342;box-shadow:0 1px 0 rgba(36,26,18,.20), 0 8px 16px -10px rgba(36,26,18,.55);min-height:56px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px;color:#241A12">
      <span style="display:flex;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.6" y="8.6" width="11.6" height="11.6" rx="2.2"/><path d="M15.4 5.4H5.8a2 2 0 0 0-2 2v9.6"/></svg></span>
      <span style="font-size:17px;line-height:25px;font-weight:600;color:#241A12;text-align:center">複製號碼</span>
    </div>
      <span data-s="raise" data-role="link" style="align-self:center;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;font-size:17px;line-height:25px;font-weight:600;color:#241A12;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px">換一組新的號碼</span></div></div>
</x-dc>
</body>
</html>
