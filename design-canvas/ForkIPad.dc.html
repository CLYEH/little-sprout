<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
    /* ── Little Sprout M1 tokens（值即實作值，ios-dev 直接抄）── */
    :root{
      --ls-board:#EFE3D0; --ls-board-2:#E3D2B8; --ls-board-3:#D9C7AB; --ls-lit:#FBF4E8;
      --ls-ink:#241A12; --ls-ink-2:#413327;
      --ls-cta:#8A3016; --ls-cta-deep:#6B2410; --ls-on-cta:#FFFFFF;
      --ls-wine:#6E1424; --ls-sprout:#1F5230; --ls-edge:#7D6342;
      --ls-r-window:12px; --ls-r-control:14px; --ls-r-card:18px;
      --ls-sp-1:4px; --ls-sp-2:8px; --ls-sp-3:12px; --ls-sp-4:16px;
      --ls-sp-5:24px; --ls-sp-6:32px; --ls-tap-min:44px;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;-webkit-font-smoothing:antialiased;background:#EFE3D0;color:#241A12;text-wrap:pretty}
    a{color:#241A12;text-decoration:underline} a:hover{color:#8A3016}
    /* 紙的紋理：卡紙不是純色。全稿唯一用到透明度的地方。 */
    .g::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      mix-blend-mode:multiply}
  </style></helmet>

<div class="g" style="position:relative;width:1194px;height:834px;background:#EFE3D0;overflow:hidden">
  <div style="display:grid;grid-template-columns:460px minmax(0, 1fr);gap:44px;padding:44px 64px;align-content:start">
    <div data-col="desc" style="display:flex;flex-direction:column;gap:32px">
      <div style="display:flex;flex-direction:column;gap:24px">
        
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px">
    <span style="font-size:13px;line-height:18px;font-weight:500;color:#413327;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">已用 ama@gmail.com 登入</span>
    <span data-s="raise" data-role="link" style="align-self:flex-start;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;font-size:13px;line-height:18px;font-weight:600;color:#241A12;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px">換帳號</span>
  </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <h1 data-cap="L" style="font-size:42px;line-height:50px;font-weight:700;letter-spacing:-.015em;color:#241A12;margin:0">接下來，<br>選一個開始</h1>
          <p style="font-size:19px;line-height:28px;font-weight:400;color:#413327;margin:0">加入家人已經開好的空間，或是自己開一個。</p>
        </div>
      </div>
      
  <div data-s="flat" style="border:1px solid #7D6342;border-radius:12px;padding:16px;display:flex;gap:12px;align-items:flex-start">
    <span style="display:flex;flex:none;color:#413327"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.4" r="3.4"/><path d="M2.8 20c.8-3.4 3.2-5.2 6.2-5.2s5.4 1.8 6.2 5.2"/><path d="M16 5.4a3.4 3.4 0 0 1 0 6.6M17.4 14.8c2.2.7 3.4 2.4 3.8 5.2"/></svg></span>
    <span style="font-size:19px;line-height:28px;font-weight:400;color:#413327;text-shadow:0 1px 0 rgba(255,250,238,.75)">選錯了也沒關係。之後還可以加入別的家庭，一個帳號可以同時待在好幾個家裡；你在每個家裡的身分也可以不一樣。</span>
  </div>
    </div>
    <div data-col="options" style="display:flex;flex-direction:column;gap:32px;max-width:600px;padding-top:29px">
  
  <div data-s="raise" data-role="choice" data-cta="1" data-pause="iPad 選項卡：卡內距 44（卡面本身就是點擊面）＋卡間距 32，所以字到字之間必然超過 120px —— 那是卡片的厚度，不是版面的空洞" style="background:#8A3016;border-radius:18px;border-bottom:3px solid #6B2410;box-shadow:0 1px 0 rgba(36,26,18,.20), 0 8px 16px -10px rgba(36,26,18,.55);padding:44px 32px;display:flex;gap:16px;align-items:flex-start">
    <span style="flex:none;width:44px;height:44px;border-radius:50%;background:#6B2410;display:flex;align-items:center;justify-content:center;color:#FFFFFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="12" r="3.6"/><path d="M11.6 12h9.2M17.6 12v3.4M20 12v2.4"/></svg></span>
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <span data-cap="R" style="font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.01em;color:#FFFFFF">我有邀請碼</span>
      <span style="font-size:19px;line-height:28px;font-weight:400;color:#FFFFFF">家人給你一組 6 位數字。輸入之後，等他按下核准，你就進到家裡了。</span>
    </div>
  </div>
  
  <div data-s="raise" data-role="choice" data-pause="iPad 選項卡：卡內距 44（卡面本身就是點擊面）＋卡間距 32，所以字到字之間必然超過 120px —— 那是卡片的厚度，不是版面的空洞" style="background:#D9C7AB;border-radius:14px;border-bottom:3px solid #7D6342;box-shadow:0 1px 0 rgba(36,26,18,.20), 0 8px 16px -10px rgba(36,26,18,.55);padding:44px 32px;display:flex;gap:16px;align-items:flex-start">
    <span style="flex:none;width:44px;height:44px;border-radius:50%;background:#E3D2B8;display:flex;align-items:center;justify-content:center;color:#413327"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.2 13.8a3.8 3.8 0 0 0 5.6.3l2.6-2.6a3.8 3.8 0 0 0-5.4-5.4l-1.5 1.5"/><path d="M13.8 10.2a3.8 3.8 0 0 0-5.6-.3l-2.6 2.6a3.8 3.8 0 0 0 5.4 5.4l1.5-1.5"/></svg></span>
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <span  style="font-size:19px;line-height:28px;font-weight:600;color:#241A12">家人傳了連結給我</span>
      <span style="font-size:19px;line-height:28px;font-weight:400;color:#413327">連結點不開的話，把它整段貼進來也可以，我們會認出裡面的號碼。</span>
    </div>
  </div>
  
  <div data-s="raise" data-role="choice" data-pause="iPad 選項卡：卡內距 44（卡面本身就是點擊面）＋卡間距 32，所以字到字之間必然超過 120px —— 那是卡片的厚度，不是版面的空洞" style="background:#D9C7AB;border-radius:14px;border-bottom:3px solid #7D6342;box-shadow:0 1px 0 rgba(36,26,18,.20), 0 8px 16px -10px rgba(36,26,18,.55);padding:44px 32px;display:flex;gap:16px;align-items:flex-start">
    <span style="flex:none;width:44px;height:44px;border-radius:50%;background:#E3D2B8;display:flex;align-items:center;justify-content:center;color:#413327"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.4 12 4l8 6.4V19a1.4 1.4 0 0 1-1.4 1.4H5.4A1.4 1.4 0 0 1 4 19Z"/><path d="M9.6 20.4v-6h4.8v6"/></svg></span>
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <span  style="font-size:19px;line-height:28px;font-weight:600;color:#241A12">建立我們家的空間</span>
      <span style="font-size:19px;line-height:28px;font-weight:400;color:#413327">沒有人邀請你？自己開一個，再把號碼發給想看照片的家人。</span>
    </div>
  </div></div>
  </div>
</div>
</x-dc>
</body>
</html>
