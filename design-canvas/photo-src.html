<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#241608;overflow:hidden}
  .shot{position:relative;width:1200px;height:1560px;overflow:hidden;isolation:isolate;background:#241608}
  .l{position:absolute;inset:0}
</style></head>
<body>
<!--
  照片位的底：午後四點，窗光落在地板的毯子上，光圈全開。
  地上有翻倒的塑膠碗、兩塊木頭積木、皺起來的毯子、前景一隻很糊的鞋。
  ※ 這是「還沒放照片的照片位」，不是主視覺完稿。
    人物（要有臉、至少兩人）本管線畫不出可用的品質 —— 攝影指示見畫布便利貼與 Notes。
-->
<div class="shot"><div class="l" style="transform:rotate(-1.4deg) scale(1.08);transform-origin:46% 50%">

  <!-- ══ 1. 房間，全部散景 ══ -->
  <div class="l" style="background:
      linear-gradient(166deg,#201307 0%,#3A2410 16%,#5C3B18 34%,#7A5124 50%,#59381A 70%,#2E1C0C 88%,#180E05 100%)"></div>
  <div class="l" style="filter:blur(62px)">
    <div style="position:absolute;left:50%;top:-30%;width:76%;height:60%;background:
        linear-gradient(202deg,#FFFEFC 0%,#FFF9EC 30%,#F8E4BE 62%,rgba(198,154,100,0) 100%)"></div>
  </div>
  <div class="l" style="filter:blur(40px);opacity:.5">
    <div style="position:absolute;left:66%;top:-26%;width:2.6%;height:54%;background:#7A5228"></div>
  </div>
  <div class="l" style="filter:blur(42px)">
    <div style="position:absolute;left:6%;top:4%;width:170px;height:170px;border-radius:50%;background:rgba(255,226,176,.24)"></div>
    <div style="position:absolute;left:32%;top:-4%;width:124px;height:124px;border-radius:50%;background:rgba(255,214,158,.18)"></div>
  </div>
  <div class="l" style="filter:blur(30px)">
    <div style="position:absolute;left:-10%;top:38%;width:122%;height:72%;background:
        linear-gradient(180deg,#8A5C2C 0%,#6B4520 26%,#43290F 62%,#1C1106 100%)"></div>
  </div>
  <div class="l" style="filter:blur(48px)">
    <div style="position:absolute;left:18%;top:32%;width:84%;height:54%;background:
        linear-gradient(196deg,rgba(255,242,214,.92),rgba(230,190,134,.3) 50%,rgba(150,106,58,0) 90%);
        clip-path:polygon(30% 0,94% 0,100% 100%,-8% 100%)"></div>
  </div>
  <div class="l" style="filter:blur(12px);opacity:.36">
    <div style="position:absolute;left:8%;top:38%;width:100%;height:42%;background:
      repeating-linear-gradient(97deg,rgba(44,24,10,.55) 0 5px,rgba(0,0,0,0) 5px 118px)"></div>
  </div>

  <svg class="l" width="1200" height="1560" viewBox="0 0 1200 1560">
    <defs>
      <filter id="s2"  x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
      <filter id="s4"  x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4.5"/></filter>
      <filter id="s10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="s22" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
      <filter id="s52" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="52"/></filter>

      <linearGradient id="adult" x1=".78" y1="0" x2=".26" y2="1">
        <stop offset="0"   stop-color="#EDC característica"/>
        <stop offset="0"   stop-color="#EDC496"/>
        <stop offset=".24" stop-color="#C89066"/>
        <stop offset=".6"  stop-color="#96633B"/>
        <stop offset="1"   stop-color="#603C1D"/>
      </linearGradient>
      <linearGradient id="child" x1=".76" y1="0" x2=".28" y2="1">
        <stop offset="0"   stop-color="#FBDCB0"/>
        <stop offset=".26" stop-color="#E0AE7C"/>
        <stop offset=".64" stop-color="#B07A4C"/>
        <stop offset="1"   stop-color="#7A4C26"/>
      </linearGradient>
      <linearGradient id="rug" x1=".8" y1="0" x2=".2" y2="1">
        <stop offset="0"   stop-color="#EFDCB6"/>
        <stop offset=".3"  stop-color="#D0B084"/>
        <stop offset=".72" stop-color="#9A7648"/>
        <stop offset="1"   stop-color="#5A4021"/>
      </linearGradient>
    </defs>

    <!-- ══ 2. 上緣：沙發與矮櫃，糊成兩團 ══ -->
    <g filter="url(#s52)">
      <path d="M1200 -60 l0 700 q-160 -24 -240 -166 q-76 -134 -30 -324 q42 -168 182 -232 Z" fill="#3A2510"/>
      <path d="M96 -60 q216 -26 272 156 q46 132 -24 258 q-62 114 -188 134 q-116 18 -178 -44 l0 -504 Z" fill="#42290F"/>
    </g>
    <g filter="url(#s22)" fill="none" stroke-linecap="round">
      <path d="M1002 -20 q-92 178 -48 354 q30 116 118 186" stroke="#FFE6BA" stroke-width="26" opacity=".5"/>
      <path d="M352 90 q54 148 -20 268" stroke="#F2CE9A" stroke-width="18" opacity=".3"/>
    </g>

    <!-- ══ 3. 毯子 ══ -->
    <g filter="url(#s10)">
      <path d="M-80 880 q260 -112 620 -74 q380 40 700 180 l0 634 -1320 0 Z" fill="url(#rug)"/>
    </g>
    <g filter="url(#s10)" fill="none" stroke-linecap="round">
      <path d="M-40 992 q300 -86 640 -36" stroke="#FFF0CC" stroke-width="15" opacity=".38"/>
      <path d="M40 1084 q320 -62 660 20" stroke="#8A6A3E" stroke-width="13" opacity=".34"/>
      <path d="M-20 1206 q340 -42 700 68" stroke="#FFEBC2" stroke-width="11" opacity=".22"/>
      <path d="M120 1336 q360 -32 720 86" stroke="#7A5A32" stroke-width="17" opacity=".26"/>
    </g>

    <!-- ══ 4. 雜訊：碗與積木，在他們後面一點，失焦 ══ -->
    <g filter="url(#s10)">
      <ellipse cx="828" cy="836" rx="112" ry="40" fill="#2C1B0A" opacity=".42"/>
      <path d="M728 818 q4 -58 100 -60 q98 2 104 60 q-10 42 -104 44 q-96 -2 -100 -44 Z" fill="#8E5527"/>
      <ellipse cx="828" cy="816" rx="102" ry="34" fill="#BD7B41"/>
      <ellipse cx="828" cy="814" rx="80" ry="23" fill="#6E4527"/>
      <path d="M754 810 q22 26 74 28 q52 -2 74 -28 q-6 24 -74 26 q-68 -2 -74 -26 Z" fill="#3A2210"/>
      <path d="M766 800 q34 -18 62 -18" stroke="#E8B77E" stroke-width="10" fill="none" stroke-linecap="round" opacity=".55"/>
      <path d="M762 792 q50 -24 116 -14" stroke="#FFE8B8" stroke-width="9" fill="none" stroke-linecap="round" opacity=".8"/>
    </g>
    <g filter="url(#s22)">
      <path d="M978 892 l70 -26 50 28 -2 60 -70 26 -48 -28 Z" fill="#5E3A18"/>
      <path d="M978 892 l70 -26 50 28 -70 26 Z" fill="#CE9558"/>
      <path d="M1048 920 l0 60 50 -26 -2 -60 Z" fill="#3E2610"/>
      <path d="M1104 940 l60 -22 44 24 -2 52 -60 22 -42 -24 Z" fill="#56341A"/>
      <path d="M1104 940 l60 -22 44 24 -60 22 Z" fill="#B98450"/>
    </g>

    <!-- ══ 8. 前景：一隻很糊的小布鞋、桌腳 ══ -->
    <g filter="url(#s52)">
      <path d="M-120 1560 q40 -220 250 -246 q170 -20 226 96 q42 88 -30 150 Z" fill="#1E1207"/>
      <path d="M20 1412 q120 -34 200 20" stroke="#6B4A22" stroke-width="30" fill="none" stroke-linecap="round" opacity=".45"/>
    </g>
    <g filter="url(#s52)">
      <path d="M1070 1560 q-30 -186 96 -256 l34 -12 0 268 Z" fill="#160D04"/>
    </g>
  </svg>

  <!-- ══ 9. 光暈 ══ -->
  <svg class="l" width="1200" height="1560" style="mix-blend-mode:screen;opacity:.4">
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="32"/></filter>
    <g filter="url(#bloom)" fill="none" stroke-linecap="round">
      <path d="M762 792 q50 -24 116 -14" stroke="#FFDCA2" stroke-width="20"/>
      <path d="M1002 -20 q-92 178 -48 354" stroke="#FFE0AC" stroke-width="34"/>
    </g>
  </svg>

  <!-- ══ 10. 霧、暗角、底片黑階、顆粒 ══ -->
  <div class="l" style="mix-blend-mode:screen;opacity:.4;background:
      radial-gradient(46% 28% at 78% 6%, rgba(255,244,218,.98), rgba(255,210,152,.28) 48%, rgba(0,0,0,0) 78%)"></div>
  <div class="l" style="mix-blend-mode:screen;opacity:.11;background:
      radial-gradient(92% 58% at 60% 24%, rgba(255,216,162,.5), rgba(0,0,0,0) 74%)"></div>
  <div class="l" style="mix-blend-mode:multiply;opacity:.54;background:
      radial-gradient(102% 78% at 40% 54%, rgba(255,255,255,0) 32%, rgba(20,12,4,.92) 100%)"></div>
  <div class="l" style="mix-blend-mode:screen;opacity:.07;background:#6A4A2A"></div>

  <svg class="l" width="1200" height="1560" style="mix-blend-mode:overlay;opacity:.38">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1200" height="1560" filter="url(#g)"/>
  </svg>
  <svg class="l" width="1200" height="1560" style="mix-blend-mode:soft-light;opacity:.42">
    <filter id="g2"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.019" numOctaves="4" seed="41"/>
      <feColorMatrix type="saturate" values="0"/></filter>
    <rect width="1200" height="1560" filter="url(#g2)"/>
  </svg>
</div>
</div>
</body></html>
