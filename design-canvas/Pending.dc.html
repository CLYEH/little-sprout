<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
    /* ── Little Sprout M1 tokens（值即實作值，ios-dev 直接抄）── */
    :root{
      --ls-board:#EFE3D0; --ls-board-2:#E3D2B8; --ls-board-3:#D9C7AB; --ls-lit:#FBF4E8;
      --ls-ink:#241A12; --ls-ink-2:#413327;
      --ls-cta:#8A3016; --ls-cta-deep:#6B2410; --ls-on-cta:#FFFFFF;
      --ls-wine:#6E1424; --ls-sprout:#1F5230; --ls-edge:#7D6342;
      --ls-r-window:12px; --ls-r-control:14px; --ls-r-card:18px;
      --ls-sp-1:4px; --ls-sp-2:8px; --ls-sp-3:12px; --ls-sp-4:16px;
      --ls-sp-5:24px; --ls-sp-6:32px; --ls-tap-min:44px;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;-webkit-font-smoothing:antialiased;background:#EFE3D0;color:#241A12;text-wrap:pretty}
    a{color:#241A12;text-decoration:underline} a:hover{color:#8A3016}
    /* 紙的紋理：卡紙不是純色。全稿唯一用到透明度的地方。 */
    .g::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      mix-blend-mode:multiply}
  </style></helmet>
<div class="g" data-col="phone" style="position:relative;width:390px;height:844px;background:#EFE3D0;overflow:hidden;display:flex;flex-direction:column">
<div style="padding:59px 24px 0">
  <div style="min-height:44px;display:flex;align-items:center;gap:8px;color:#1F5230">
    <span style="display:flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.8 12.4 4.6 4.6 9.8-10"/></svg></span>
    <span style="font-size:17px;line-height:25px;font-weight:600;color:#1F5230">申請已送出</span>
  </div>
</div>
<div style="display:flex;flex-direction:column;gap:24px;padding:16px 24px 34px;flex-grow:1">
  
  <div style="display:flex;flex-direction:column;gap:8px">
    <h1 style="font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.01em;color:#241A12;margin:0">等家長按下核准</h1>
    <p style="font-size:17px;line-height:25px;font-weight:400;color:#413327;margin:0">陳家的家長會收到通知。</p>
  </div>
  
  <div data-s="win" data-role="photo" style="background:#E3D2B8;border:1px solid #7D6342;border-radius:14px;box-shadow:inset 0 1.5px 0 rgba(36,26,18,.34), inset 0 4px 6px -3px rgba(36,26,18,.22), inset 0 -1.5px 0 rgba(255,250,238,.75);padding:0;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
    <span style="display:flex;color:#413327"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.2V12l3.2 2"/></svg></span>
    <span style="font-size:17px;line-height:25px;font-weight:400;color:#413327">核准之後，照片會出現在這裡</span>
  </div>
  
  <div data-s="flat" style="border:1px solid #7D6342;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px">
    
    
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
             <span style="font-size:15px;line-height:21px;font-weight:600;color:#413327">要加入的家庭</span>
             <span style="font-size:17px;line-height:25px;font-weight:600;color:#241A12;text-align:right;text-shadow:0 1px 0 rgba(255,250,238,.75);overflow-wrap:anywhere">陳家</span>
           </div><div style="height:1px;background:#7D6342"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
             <span style="font-size:15px;line-height:21px;font-weight:600;color:#413327">送出時間</span>
             <span style="font-size:17px;line-height:25px;font-weight:600;color:#241A12;text-align:right;text-shadow:0 1px 0 rgba(255,250,238,.75);overflow-wrap:anywhere">今天 14:32</span>
           </div><div style="height:1px;background:#7D6342"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px">
             <span style="font-size:15px;line-height:21px;font-weight:600;color:#413327">你的身分</span>
             <span style="font-size:17px;line-height:25px;font-weight:600;color:#241A12;text-align:right;text-shadow:0 1px 0 rgba(255,250,238,.75);overflow-wrap:anywhere">家人（可以上傳照片）</span>
           </div>
  </div>
  <span style="font-size:13px;line-height:18px;font-weight:500;color:#413327">核准之前看不到家庭裡的任何東西——這是保護孩子照片的做法，不是出錯了。</span>
  <div data-s="raise" data-role="button" style="background:#D9C7AB;border-radius:14px;border-bottom:3px solid #7D6342;box-shadow:0 1px 0 rgba(36,26,18,.20), 0 8px 16px -10px rgba(36,26,18,.55);min-height:56px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px;color:#241A12">
      <span style="display:flex;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.4 4.4v4.4H16"/></svg></span>
      <span style="font-size:17px;line-height:25px;font-weight:600;color:#241A12;text-align:center">看看核准了沒</span>
    </div>
  <span data-s="raise" data-role="link" style="align-self:center;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;font-size:17px;line-height:25px;font-weight:600;color:#241A12;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px">改用別組邀請碼</span>
</div></div>
</x-dc>
</body>
</html>
