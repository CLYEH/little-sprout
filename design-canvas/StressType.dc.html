<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
    /* ── Little Sprout M1 tokens（值即實作值，ios-dev 直接抄）── */
    :root{
      --ls-board:#EFE3D0; --ls-board-2:#E3D2B8; --ls-board-3:#D9C7AB; --ls-lit:#FBF4E8;
      --ls-ink:#241A12; --ls-ink-2:#413327;
      --ls-cta:#8A3016; --ls-cta-deep:#6B2410; --ls-on-cta:#FFFFFF;
      --ls-wine:#6E1424; --ls-sprout:#1F5230; --ls-edge:#7D6342;
      --ls-r-window:12px; --ls-r-control:14px; --ls-r-card:18px;
      --ls-sp-1:4px; --ls-sp-2:8px; --ls-sp-3:12px; --ls-sp-4:16px;
      --ls-sp-5:24px; --ls-sp-6:32px; --ls-tap-min:44px;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;-webkit-font-smoothing:antialiased;background:#EFE3D0;color:#241A12;text-wrap:pretty}
    a{color:#241A12;text-decoration:underline} a:hover{color:#8A3016}
    /* 紙的紋理：卡紙不是純色。全稿唯一用到透明度的地方。 */
    .g::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      mix-blend-mode:multiply}
  </style></helmet>

<div class="g" data-col="phone" style="position:relative;width:390px;height:1700px;background:#EFE3D0;overflow:hidden;display:flex;flex-direction:column">
  <div style="padding:59px 24px 0">
    <div style="min-height:53px;display:flex;align-items:center;gap:8px;color:#241A12">
      <svg width="37" height="37" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5 8 12l6.5 7"/></svg>
      <span style="font-size:53px;line-height:78px;font-weight:600">返回</span>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:32px;padding:24px 24px 34px;flex-grow:1">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:4px">
        <span style="width:44px;height:5px;border-radius:3px;background:#241A12"></span>
        <span style="width:44px;height:5px;border-radius:3px;background:#7D6342"></span>
      </div>
      <span style="font-size:40px;line-height:56px;font-weight:500;color:#413327">步驟 1，共 2 步</span>
    </div>
    <h1 style="font-size:87px;line-height:105px;font-weight:700;letter-spacing:-.01em;color:#241A12;margin:0">輸入你的 Email</h1>
    <p style="font-size:53px;line-height:78px;color:#413327;margin:0">我們會寄一組 6 位數字給你，不用記密碼。</p>
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font-size:47px;line-height:65px;font-weight:600;color:#413327">Email</span>
      <div data-s="win" data-role="field" style="background:#E3D2B8;border:2px solid #241A12;border-radius:12px;box-shadow:inset 0 2px 0 rgba(36,26,18,.34);min-height:174px;display:flex;align-items:center;padding:16px">
        <span style="font-size:53px;line-height:78px;color:#241A12;overflow-wrap:break-word">ama@<wbr>gmail.<wbr>com</span>
      </div>
    </div>
    <div data-s="raise" data-role="button" data-cta="1" style="background:#8A3016;border-radius:14px;border-bottom:3px solid #6B2410;box-shadow:0 1px 0 rgba(36,26,18,.20), 0 8px 16px -10px rgba(36,26,18,.55);min-height:174px;display:flex;align-items:center;justify-content:center;padding:16px;color:#FFFFFF">
      <span style="font-size:53px;line-height:78px;font-weight:600;color:#FFFFFF;text-align:center">傳送驗證碼</span>
    </div>
    <p style="font-size:40px;line-height:56px;color:#413327;margin:0">信通常一分鐘內會到。沒看到的話，找找垃圾郵件。</p>
  </div>
</div>
</x-dc>
</body>
</html>
