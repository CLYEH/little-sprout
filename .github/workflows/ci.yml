# Merge gate 的 CI 面（另一半是 merge-reviewer 的 code review）。
# rules job 是「前饋必有反饋」原則的機械 gate（docs/COLLABORATION.md §0、§7）。
# hooks 隨分支內容走、且可被 --no-verify 繞過，所以 commit message／branch 命名／
# secrets 在此都有伺服器端兜底——本機 hook 只是快速回饋，CI 才是強制。
# LS-85：push（development／test／main）也跑四 job——晉升改 fast-forward push（scripts/ops/promote.sh），每個進到
# test／main 的 SHA 都要有四個綠 check，branch protection 的 required checks 對推上去的 SHA 生效（server-side 硬 gate）。
name: CI

on:
  pull_request:
    branches: [development, test, main]
  push:
    branches: [development, test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 規約檢查（ubuntu，快且免費）。pull_request 與 push 都跑（LS-85）：rules 若在 push 事件下整 job 跳過，該 SHA 的
  # check-run conclusion 是 skipped——promote.sh 拒、GitHub required checks 也不算綠。缺 PR 上下文（base_ref／head_ref／
  # PR body）的 step 各自標 if: github.event_name == 'pull_request'；用 startsWith(github.head_ref, …) 的 step 在 push 下
  # head_ref 為空、自然不跑；純檔案比對與自測 step 兩種事件都跑。
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.head_ref }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR direction matrix
        if: github.event_name == 'pull_request'
        run: |
          ok=false
          case "$BASE" in
            development)
              case "$HEAD" in feature/*|fix/*|hotfix/*|main|revert-*) ok=true ;; esac ;;
            test)
              case "$HEAD" in development|main|revert-*) ok=true ;; esac ;;
            main)
              case "$HEAD" in test|hotfix/*|revert-*) ok=true ;; esac ;;
          esac
          if [ "$ok" != true ]; then
            echo "::error::PR 方向違規：$HEAD → $BASE。合法方向：feature|fix|hotfix→development、development|main→test、test|hotfix/*→main、revert-* 允許回各保護分支"
            exit 1
          fi

      - name: Branch naming / commit messages / secrets（hooks 的伺服器端兜底）
        if: github.event_name == 'pull_request'
        run: |
          base_sha=$(git merge-base "origin/$BASE" HEAD)
          # 工作分支才驗命名與逐筆 commit message（back-merge/promote/revert 的
          # commit 已在先前 PR 驗過，且含 harness bootstrap 等歷史 commit）
          case "$HEAD" in
            feature/*|fix/*|hotfix/*)
              if ! printf '%s' "$HEAD" | grep -qE '^(feature|fix|hotfix)/LS-[1-9][0-9]*-[a-z0-9][a-z0-9-]*$'; then
                echo "::error::branch 名稱「$HEAD」不符 (feature|fix|hotfix)/LS-<n>-<slug> 規約"
                exit 1
              fi
              bad=0
              # LS-10：排除已經在任一保護分支上的 commit（--not origin/main
              # origin/development origin/test）。工作分支若曾把保護分支 merge
              # 回來（例如解衝突），base_sha..HEAD 會連帶包含保護分支自己的歷史
              # commit；這些 commit 已經在它們原本的 PR 驗過格式，且可能是格式
              # 規約生效之前的舊 commit（例如 harness bootstrap）。不排除的話，
              # 一旦保護分支上出現一個不合規的歷史 commit，往後每一個把該分支
              # merge 回來的 feature PR 都會被這裡永久卡死。
              while IFS= read -r line; do
                case "$line" in
                  Merge\ *|Revert\ *|fixup!*|squash!*) continue ;;
                esac
                if ! printf '%s' "$line" | grep -qE '^(feat|fix|chore|docs|refactor|test|perf|design)(\([a-z0-9-]+\))?: LS-[1-9][0-9]* .+'; then
                  echo "::error::commit message 不符規約：$line"
                  bad=1
                fi
              done < <(git log "$base_sha..HEAD" --not origin/main origin/development origin/test --format=%s)
              [ "$bad" -eq 0 ]
              ;;
          esac
          # secrets 掃描（所有 PR 都掃，pattern 與 pre-commit hook 共用）
          git diff "$base_sha"...HEAD | grep '^+' | grep -v '^+++' \
            | bash scripts/gates/scan-secrets.sh

      # LS-50：分支起點乾淨度（push-gate 第 6 步的伺服器端兜底）——工作分支自 merge-base 以來的非 merge commit
      # 票號必須等於分支票號；夾帶他票須 commit body 與 PR body 各有獨佔一行的 `Bundles: LS-<m>`（逃生口使用在
      # PR 可見）。只在工作分支 head 執行：promote／back-merge 的 head 是保護分支，沒有「本票」可比（同 LS-10）。
      # 姊妹規則 merge-conflict-check（push-gate 第 7 步）CI 無法承載：GitHub 對不可合併的 PR 根本不觸發本 workflow。
      - name: 分支起點乾淨度（工作分支不得夾帶他票 commit；branch-ticket-check，LS-50）
        if: startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'hotfix/')
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          bash scripts/gates/branch-ticket-check.sh --branch "$HEAD" --base "origin/$BASE" --pr-body "$RUNNER_TEMP/pr-body.txt"

      # LS-63：PR body 檔頭段須含 head 分支票號（scripts/gates/pr-body-check.sh；agent 在 gh pr create/edit 前對 body 檔
      # 呼叫同一支腳本，這裡是伺服器端兜底）。來源：LS-53／LS-56 兩個 agent 共用 scratchpad/pr-body.md 撞檔，
      # LS-53 的 gh pr edit 把 LS-56 的 body 貼上 PR #78——暫存檔命名規約在 repo 外無法機械驗，驗它要防的結果。
      # 同 LS-50 只在工作分支 head 執行：promote／back-merge 的 head 是保護分支，沒有「本票」可比。
      - name: PR body 檔頭段含本票票號（pr-body-check，LS-63）
        if: startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'hotfix/')
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body-check.txt"
          bash scripts/gates/pr-body-check.sh --branch "$HEAD" "$RUNNER_TEMP/pr-body-check.txt"

      # LS-45／LS-41／LS-54／LS-53／LS-50／LS-63：gate 腳本自己的負向測試——每個 PR 都跑，確保「標記獨佔一行才
      # 放行」（destructive-approval-check）、「schema／文件對帳」（api-contract-check）、
      # 「錯誤碼表／LSErrorCode 對帳」（error-codes-check）、「migration 兩級分級／BREAKING: 段落」
      # （migration-breaking-check／breaking-section-check）、「migration 版本號撞號」（migration-version-check，LS-70）、
      # 「分支不夾帶他票 commit／push 前無合併衝突」
      # （branch-ticket-check／merge-conflict-check）、「PR body 檔頭段含本票票號」（pr-body-check）與
      # 「審查取證不進版控」（evidence-path-check）與「品牌 skill 接線」（brand-skill-check，LS-30）與「push 目標 ref 分類：
      # 刪除／tag 早退、test／main 只准 promote.sh FF」（push-ref-check，LS-85）與「agent 定義 tools: 白名單含必要工具」
      # （agent-tools-check，LS-87）與「PreToolUse H1-H3 fail-closed 分派」（pretool，LS-88）的偵測不退化
      # （前饋必有反饋，對 gate 本身也適用）。集中在同一個 step，維持「一個地方跑所有 gate 自測」。
      - name: Gate 腳本自測（destructive-approval-check／api-contract-check／error-codes-check／migration-breaking-check／migration-version-check／breaking-section-check／branch-ticket-check／merge-conflict-check／pr-body-check／evidence-path-check／brand-skill-check／push-ref-check／agent-tools-check／push-gate／pretool）
        run: |
          # LS-54 N5：每支各收各的 rc、最後一起 exit——run: 預設 bash -e 會在第一支紅時
          # 就中止，後面的根本沒跑、結果看不到，修好一支再推一次才知道下一支紅不紅。
          rc=0
          bash scripts/gates/destructive-approval-check.test.sh || rc=1
          bash scripts/gates/api-contract-check.test.sh || rc=1
          bash scripts/gates/error-codes-check.test.sh || rc=1
          bash scripts/gates/migration-breaking-check.test.sh || rc=1
          bash scripts/gates/migration-version-check.test.sh || rc=1
          bash scripts/gates/breaking-section-check.test.sh || rc=1
          bash scripts/gates/branch-ticket-check.test.sh || rc=1
          bash scripts/gates/merge-conflict-check.test.sh || rc=1
          bash scripts/gates/pr-body-check.test.sh || rc=1
          bash scripts/gates/evidence-path-check.test.sh || rc=1
          bash scripts/gates/brand-skill-check.test.sh || rc=1
          bash scripts/gates/push-ref-check.test.sh || rc=1
          bash scripts/gates/agent-tools-check.test.sh || rc=1
          bash scripts/gates/detect-simulator.test.sh || rc=1
          bash scripts/gates/push-gate.test.sh || rc=1
          bash scripts/hooks/pretool.test.sh || rc=1
          exit "$rc"

      # LS-30：品牌 skill 接線——前饋是 ui-designer／visual-reviewer 定義「開工先載入 little-sprout-brand」，載入動作
      # 發生在 subagent 內部、repo 側驗不到；這裡驗它的前提：.claude/skills/little-sprout-brand/SKILL.md 存在且
      # frontmatter name／description 齊、SKILL.md 引用的 references/*.md 都在、兩份 agent 定義仍含必載指示。
      # 純檔案比對、不依賴 PR body，所有 PR 都跑（同 secrets 掃描／tracked-ignored）。
      - name: 品牌 skill 接線（brand-skill-check，LS-30）
        run: bash scripts/gates/brand-skill-check.sh

      # LS-87 R3 F2：agent 定義 tools: 白名單——qa／merge-reviewer「裁決必貼 status」靠 Bash、讀票寫 comment 靠 Linear 三支、
      # qa 視覺驗收對設計稿路徑靠 pencil get_app_state、ui-designer／visual-reviewer 靠 pencil execute；白名單是窮舉的，漏列即
      # 靜默不可執行（CI 四項全綠、下一次派工才發現）。驗 frontmatter tools: 含必要工具（整字比對；無 tools: 行＝繼承全部、放行）。
      - name: Agent 定義工具白名單（agent-tools-check，LS-87）
        run: bash scripts/gates/agent-tools-check.sh

      # LS-71：ops 腳本自測——patrol.sh（巡檢）用合成 repo（file:// 裸 origin＋七個 worktree）驗各停滯型態判定的
      # 正負樣本、--json 合法、gh 不可用不炸；session-start.sh（SessionStart hook）驗輸出合法 JSON 且 fail-soft、
      # .claude/settings.json 有掛上。獨立 step、不併進上面的 gate 自測 step（同 LS-51 的理由：避開與同時在飛的
      # harness 票改同一 step 撞衝突；巡檢也不是 merge gate）。
      # LS-70：supabase-lock.sh（本機容器序列化 lock）自測也在這裡——合成 lock 目錄驗互斥／exit code／逾時／死鎖回收與
      # 不誤殺剛建的鎖／重入／TERM 釋放／run.sh 自動經 lock，不碰容器。各收各的 rc、最後一起 exit（同 LS-54 N5）。
      # LS-85：promote.sh（晉升＝FF push）自測——合成 repo＋stub gh 驗方向錯拒、非 FF 拒、check 紅／缺／skipped／未完成拒、
      # 同名多筆取最新、正常放行且 push 帶 PROMOTE_VIA_SCRIPT=1；patrol.test.sh 加三分支漂移案例。
      # LS-87：post-status.sh（裁決貼 commit status）自測——stub gh 驗 endpoint／欄位、短 SHA／錯 context／錯 state／空或過長
      # description 拒、gh 失敗與回讀不符不當成已貼；promote.test.sh 加 merge-review／qa status 缺／failure／pending 拒；
      # patrol.test.sh 加 hooksPath／hook 可執行檢查。
      # LS-91：pen-open.sh（Pen app 開檔路徑對帳）／pen-land.sh（.pen 落地機械化，取代 LS-26 手動 SOP）自測——
      # 前者 stub open／pen 驗一致／不一致／Pen 未開／看門狗逾時／--status／參數與環境錯誤；後者用合成
      # backup／worktree fixture（$PEN_BACKUP_DIR 覆寫）驗合法落地／--expect-nodes 傳遞／backup 缺／meta 三鍵
      # 各一組即拒／壞 JSON／dry-run 零副作用／參數形狀，全程不碰真正的 ~/.pencil/backup 或 design/littlesprout.pen。
      - name: Ops 腳本自測（patrol／session-start／supabase-lock／promote／post-status／pen-open／pen-land，LS-71／LS-70／LS-85／LS-87／LS-91）
        run: |
          rc=0
          bash scripts/ops/patrol.test.sh || rc=1
          bash scripts/ops/supabase-lock.test.sh || rc=1
          bash scripts/ops/promote.test.sh || rc=1
          bash scripts/ops/post-status.test.sh || rc=1
          bash scripts/ops/pen-open.test.sh || rc=1
          bash scripts/ops/pen-land.test.sh || rc=1
          exit "$rc"

      # LS-54 N4′／LS-56：docs/API.md §5 錯誤碼表 ↔ LSErrorCode rawValue ↔ migrations
      # errcode 三方雙向對帳（本機 push-gate 的伺服器端兜底）。所有 PR 都跑：純檔案比對、
      # 不依賴 PR body 標記，沒有 promote／back-merge 誤擋的問題（同 secrets 掃描）。
      - name: 錯誤碼三方對帳（docs/API.md §5 ↔ LSErrorCode ↔ migrations errcode，LS-54／LS-56）
        run: bash scripts/gates/error-codes-check.sh

      # LS-51：設計畫布（design-canvas*/）執行產物由根 .gitignore 統一 ignore，但 ignore 規則
      # 管不到「已經在 index 裡」的檔（規則落地前就 commit 進去的、或 git add -f 硬加的）——
      # 三軌的 _shotcheck.html 正是這個形狀。所以再驗 index 內沒有任何已追蹤檔命中 repo 內的
      # .gitignore（pre-commit 的伺服器端兜底）。純檔案比對、不依賴 PR body，所有 PR 都跑。
      # 自測與正式檢查同一 step、自測先跑：自測紅＝gate 沒牙，正式檢查的綠不可信。
      # （獨立 step 而不併進上面「Gate 腳本自測」，是為了避開同時在飛的 LS-53 改同一 step；
      #   LS-53 併入後可併回去，維持「一個地方跑所有 gate 自測」。）
      - name: 已追蹤檔不得命中 .gitignore（tracked-ignored-check，LS-51）
        run: |
          bash scripts/gates/tracked-ignored-check.test.sh
          bash scripts/gates/tracked-ignored-check.sh

      # LS-10：Migration rules 與 Design gate 這兩段內容檢查改比照上面的
      # commit-message 檢查，只在工作分支（feature|fix|hotfix）head 執行。
      # promote（development→test、test→main）與 back-merge 的累積 diff 會
      # 重複觸發已經在來源 feature PR 驗過的內容（且 DESTRUCTIVE-APPROVED／
      # Design: 這類 PR body 標記不會隨 promote PR 自動携帶，會被誤擋——
      # PR #10 promote 實測撞過 Design gate）。secrets 掃描沒有這個問題
      # （掃描本身不依賴 PR body 標記），維持對全部 PR 執行。
      - name: Migration rules
        if: startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'hotfix/')
        run: |
          base_sha=$(git merge-base "origin/$BASE" HEAD)
          mig=$(git diff --name-only "$base_sha"...HEAD -- supabase/migrations/ || true)
          if [ -n "$mig" ]; then
            tests=$(git diff --name-only "$base_sha"...HEAD -- supabase/tests/ || true)
            if [ -z "$tests" ]; then
              echo "::error::migration 變更必須伴隨 supabase/tests/ 的 RLS 測試變更（DB migration gate）"
              exit 1
            fi
            # LS-70：版本號撞號（push-gate 4b 的伺服器端兜底）——本分支 tree 內版本號唯一、且不與 origin/$BASE 既有
            # 版本撞號（同版本、不同檔名）。對 base 當前 tip 比，不是 merge-base：撞號正是別張票先併進去
            # （LS-57／LS-66 同取 20260825030000）。
            bash scripts/gates/migration-version-check.sh --target "origin/$BASE" || exit 1
            # LS-53：分級改由 scripts/gates/migration-breaking-check.sh 做 statement 級判定（單一 pass 剝
            # --／/* */ 註解後以 ; 切句；多行敘述、單一字面值的 execute '…' 動態 SQL 也認得——`||` 串接拆開的
            # 多字關鍵字認不得，見該檔檔頭已知限制；規則表同檔頭）。
            # 舊版逐行關鍵字 grep 命中 DROP POLICY 卻放過同義的 ALTER POLICY … (false)／REVOKE
            # （PR #60 review F7，LS-48 曾以「不觸發偵測器」為選型理由）——想避開 gate 就換寫法的前例。
            findings=$(bash scripts/gates/migration-breaking-check.sh --base "$base_sha") || exit 1
            if [ -n "$findings" ]; then
              printf 'migration 分級結果（級別<TAB>敘述）：\n%s\n' "$findings"
            fi
            # DESTRUCTIVE：維持既有——使用者本人在 PR body 蓋核可標記，LS-45 起整行錨定
            # （scripts/gates/destructive-approval-check.sh；純子字串比對曾被散文提及誤放行，PR #55 run 32626369903）
            if printf '%s\n' "$findings" | grep -q '^DESTRUCTIVE' \
               && ! printf '%s' "$PR_BODY" | bash scripts/gates/destructive-approval-check.sh; then
              echo "::error::偵測到破壞性 migration（見上方 DESTRUCTIVE 列）。此類變更需使用者本人依規約核可（docs/COLLABORATION.md §6）；agent 遇此錯誤必須停下回報使用者，不得自行處理"
              exit 1
            fi
            # BREAKING：既有呼叫端行為改變——PR body 須有行首的 BREAKING: 段落（scripts/gates/breaking-section-check.sh），
            # 且 docs/API.md 同 PR 有變更（§6 API 變更紀律：契約文件跟著改）
            if printf '%s\n' "$findings" | grep -q '^BREAKING'; then
              if ! printf '%s' "$PR_BODY" | bash scripts/gates/breaking-section-check.sh; then
                echo "::error::migration 改變既有呼叫端行為（見上方 BREAKING 列：ALTER POLICY／REVOKE／既有函式重定義等）。PR body 必須有行首的 BREAKING: 段落，同一行寫受影響的呼叫端與遷移路徑（docs/COLLABORATION.md §6）"
                exit 1
              fi
              if [ -z "$(git diff --name-only "$base_sha"...HEAD -- docs/API.md)" ]; then
                echo "::error::migration 被判 BREAKING 但 docs/API.md 在本 PR 沒有變更——呼叫端契約（權限／policy／RPC 行為）改了就要同 PR 更新契約文件（docs/COLLABORATION.md §6）"
                exit 1
              fi
            fi
          fi

      - name: Design gate（新增 SwiftUI View 需附設計稿標記）
        if: startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'hotfix/')
        run: |
          base_sha=$(git merge-base "origin/$BASE" HEAD)
          # 掃所有變更 Swift 檔的「新增行」，涵蓋新檔與寫進既有檔的新 View；
          # 已知限制：換行式 conformance 掃不到（COLLABORATION §7 標為混合 gate）
          new_views=$(git diff "$base_sha"...HEAD -- '*.swift' | grep '^+' \
            | grep -cE 'struct +[A-Za-z0-9_]+(<[^>]*>)? *: *([A-Za-z0-9_]+ *, *)*(some +)?View\b' || true)
          if [ "${new_views:-0}" -gt 0 ] && ! printf '%s' "$PR_BODY" | grep -qE 'Design:[[:space:]]*[^[:space:]]'; then
            echo "::error::PR 新增了 SwiftUI View 但 body 的 Design: 欄位是空的——新畫面必須先有 ui-designer 的 .pen 設計稿並填上 frame 名稱"
            exit 1
          fi

      # LS-26：.pen 落地結構兜底（本機 commit-gate 的伺服器端對應；
      # 無 --expect-nodes——「落地比記憶體舊」的深度驗證靠收工程序＋handoff 證據）
      - name: .pen 落地結構檢查
        if: github.event_name == 'pull_request'
        run: |
          base_sha=$(git merge-base "origin/$BASE" HEAD)
          pens=$(git -c core.quotePath=false diff --name-only --diff-filter=ACM "$base_sha"...HEAD -- '*.pen' || true)
          if [ -n "$pens" ]; then
            while IFS= read -r p; do
              bash scripts/gates/design-landing-check.sh "$p"
            done <<< "$pens"
          fi

  # DB migration gate 的執行面（LS-11）：CI 實際跑 supabase/tests/run.sh（RLS 隔離／owner
  # 不變量／trigger／併發／RLS plan 效能），把 §7 對照表「migration 必附 RLS 測試」從
  # 「有沒有動測試檔」的弱驗證，補強成「測試真的綠」。
  #
  # 這個 job 必須無條件跑到有結論——若在 job 層用 if: 整包跳過，它一旦被列為 required
  # check，GitHub 永遠等不到這個 job 的結果，PR 會卡死。所以「這個 repo 有沒有 supabase/」
  # 的判斷放在 job 內的第一個 step（用 step outputs 讓後面 step 決定要不要跑），job 本身一律執行。
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 偵測 supabase/ 目錄
        id: detect
        run: |
          if [ ! -d supabase ]; then
            echo "無 supabase/ 目錄，略過"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安裝 supabase CLI（鎖版本）
        if: steps.detect.outputs.skip == 'false'
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: 安裝 psql client
        if: steps.detect.outputs.skip == 'false'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: supabase db start（只起 DB，比 supabase start 快；測試資料直接灌 auth.users，不需要 Auth/Storage service）
        if: steps.detect.outputs.skip == 'false'
        run: supabase db start

      - name: supabase db reset（套用 supabase/migrations）
        if: steps.detect.outputs.skip == 'false'
        run: supabase db reset

      # LS-41（PR #58 review 主修）：docs/API.md ↔ migrations 對帳，改用套用完
      # migrations 的活資料庫 pg_catalog 當權威來源（--catalog 模式），不是重新剖析
      # SQL 原始碼——不受文字解析器的已知限制影響。放在 db reset 之後、run.sh
      # 之前：這是一個純比對、幾十毫秒等級的檢查，不該排在兩分鐘的 run.sh 後面才被
      # 發現紅燈（F10）。不開新 job（與 db job 共用同一個活資料庫），也不必額外把
      # job 名稱加進 branch protection 的 required checks（db 本身已是 required）。
      # 自成一段擷取 SUPABASE_DB_URL，不與下面 run.sh 那步共用變數：兩步是各自
      # 獨立的 GitHub Actions run: shell，不共享 shell 狀態，維持各自完整可讀。
      - name: API 契約對帳（docs/API.md ↔ 活資料庫 catalog，LS-41）
        if: steps.detect.outputs.skip == 'false'
        run: |
          SUPABASE_DB_URL="$(supabase status -o env | grep '^DB_URL=' | head -n1 | cut -d= -f2- | tr -d '"' || true)"
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::supabase status -o env 未能取得 DB_URL，SUPABASE_DB_URL 為空——中止，避免用空連線字串誤跑測試"
            exit 1
          fi
          export SUPABASE_DB_URL
          bash scripts/gates/api-contract-check.sh --catalog

      - name: RLS／owner 不變量／trigger／併發測試（supabase/tests/run.sh）
        if: steps.detect.outputs.skip == 'false'
        run: |
          # LS-10（PR #15 review）：run: 區塊在 pipefail 下，`grep '^DB_URL='` 若
          # 沒命中（例如 `supabase status -o env` 輸出格式改了）會讓整段管線非 0
          # 結束，而賦值語句在 -e 下會直接讓 job 中止、只留一段看不懂的通用錯誤。
          # 加 `|| true` 讓擷取失敗時能往下走到明確的非空檢查，印出好懂的
          # ::error:: 訊息再中止，不要讓 pipefail 直接吃掉診斷資訊。
          SUPABASE_DB_URL="$(supabase status -o env | grep '^DB_URL=' | head -n1 | cut -d= -f2- | tr -d '"' || true)"
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::supabase status -o env 未能取得 DB_URL，SUPABASE_DB_URL 為空——中止，避免用空連線字串誤跑測試"
            exit 1
          fi
          export SUPABASE_DB_URL
          bash supabase/tests/run.sh

      # LS-54 D2：EXPLAIN 證據（supabase/tests/evidence/）不再進 repo——計時、規劃器估計值、
      # buffers hit 數、stderr/stdout 交錯順序每次都變，tracked 會讓本機跑一次測試就弄髒工作區。
      # LS-6 驗收條件 c 的「留存」改落在這裡：每次 db job 綠燈都上傳成 artifact，保留天數
      # 顯式寫死 retention-days: 90（LS-56 F3：不押 repo／org 的環境預設，預設值改了驗收條件
      # 不會跟著靜默漂移）。run.sh 只在全部測試通過後才寫 evidence，所以不用 always()；綠了
      # 卻沒檔案是 run.sh 壞了，if-no-files-found: error 直接紅，不靜默略過。
      - name: 上傳 RLS plan 證據（supabase/tests/evidence → artifact）
        if: steps.detect.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: rls-plan-evidence
          path: supabase/tests/evidence/
          if-no-files-found: error
          retention-days: 90

  lint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint（有 Swift 檔就跑，不綁 Xcode 專案存在與否）
        run: |
          if [ -z "$(git ls-files '*.swift')" ]; then
            echo "無 Swift 檔，略過"
            exit 0
          fi
          brew install swiftlint
          swiftlint lint --strict

  ci:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # LS-106：`.xcode-version` 是本機 push-gate 與這裡共用的單一來源（macos-15 runner 預裝多個
      # Xcode 版本，這裡選定的版本會漂移；先前沒有明寫，PR #165 head 8b7a0fa 本機較寬鬆的 Xcode 版本
      # 沒攔到、CI 用的版本判編譯錯，本機兩次綠 CI 才紅）。明寫 xcode-select，讓「CI 實際用的 Xcode」
      # 有檔案可查、push-gate 才有東西可比對。
      - name: xcode-select（讀 .xcode-version 單一來源，LS-106）
        run: |
          pin="$(tr -d '[:space:]' < .xcode-version)"
          sudo xcode-select -s "/Applications/Xcode_${pin}.app/Contents/Developer"
          xcodebuild -version

      # 前饋規則「改 project.yml 須重跑 xcodegen 一併 commit」的機械 gate（§7）；
      # 生成物 byte-identical（LS-5 review 實證），不會 flaky。反向漂移（GUI 改
      # .xcodeproj 沒回填 project.yml）同樣會被抓到。
      - name: XcodeGen 漂移檢查（project.yml ↔ .xcodeproj）
        run: |
          if [ ! -f project.yml ]; then
            echo "無 project.yml，略過"
            exit 0
          fi
          brew install xcodegen
          xcodegen generate
          # LS-10：先 git add -A 再對 staged 內容 diff，涵蓋 xcodegen 產生的全新
          # untracked 檔（例如新 target 的 .xcscheme）。單純 `git diff --exit-code`
          # 只比對「已追蹤檔案」的工作目錄與 index 差異，看不到全新的 untracked
          # 檔——這是原本的盲區（PR #6 review 實測重現）。
          git add -A -- LittleSprout.xcodeproj
          git diff --cached --exit-code -- LittleSprout.xcodeproj || {
            echo "::error::project.yml 與 LittleSprout.xcodeproj 不同步——改 project.yml 後須重跑 xcodegen generate 一併 commit；若是在 Xcode GUI 改了設定，請把改動搬回 project.yml"
            exit 1
          }

      - name: Build & Test
        run: |
          if ! ls -d ./*.xcodeproj >/dev/null 2>&1 && ! ls -d ./*.xcworkspace >/dev/null 2>&1; then
            echo "::warning::尚未建立 Xcode 專案，略過 build/test（Phase 0-1 完成後生效）"
            exit 0
          fi
          dest=$(bash scripts/gates/detect-simulator.sh)
          # LS-54 N8：測試序列執行——MockURLProtocol 的 handler 是全域 static，平行測試會
          # 互相汙染。scheme（project.yml）已明寫 parallelizable: false，這裡再明確帶旗標，
          # 不把正確性押在 scheme 預設值上。
          xcodebuild test \
            -scheme LittleSprout \
            -destination "$dest" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
