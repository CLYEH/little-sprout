# 版本於 2026-10 取自 Maven 中繼資料的最新「穩定」版；AGP 刻意停在 8.x 最新（9.x 的 DSL／內建 Kotlin 變動大，
# 骨架票不吃新風險），Gradle 8.14.5 為 AGP 8.13 支援範圍。升級流程見 android/README.md。
# compileSdk／targetSdk 釘 36（.android-api）：supabase-kt 3.8.0 的傳遞依賴 androidx.browser 1.10.0 要 compileSdk 36 以上
# （票文原寫 35，CI 實測 checkDebugAarMetadata 擋下）。Compose BOM 停在 2026.06.01（foundation 1.11.4）：2026.08+ 的
# foundation 1.12 要 compileSdk 37，而 AGP 8.13 建議上限是 36。

[versions]
agp = "8.13.2"
kotlin = "2.3.21"
composeBom = "2026.06.01"
activityCompose = "1.12.4"
supabaseBom = "3.8.0"
ktor = "3.5.1"
serialization = "1.10.0"
coroutines = "1.10.2"
junit = "4.13.2"
androidxCredentials = "1.6.0"
googleid = "1.2.1"
lifecycle = "2.11.0"
detekt = "1.23.8"
ktlintGradle = "14.2.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabaseBom" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
