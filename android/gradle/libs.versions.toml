# 版本於 2026-10 取自 Maven 中繼資料的最新「穩定」版；AGP 刻意停在 8.x 最新（9.x 的 DSL／內建 Kotlin 變動大，
# 骨架票不吃新風險），Gradle 8.14.5 為 AGP 8.13 支援範圍。升級流程見 android/README.md。
# compileSdk 釘 35（.android-api）：Compose BOM 2026.06.01（foundation 1.11.4，minCompileSdk 35）與 activity-compose 1.10.1
# （minCompileSdk 35）是不需 compileSdk 36+ 的最新組合；BOM 2026.08+／activity 1.11+ 要 36 以上，隨 .android-api 一起升。
[versions]
agp = "8.13.2"
kotlin = "2.3.21"
composeBom = "2026.06.01"
activityCompose = "1.10.1"
supabaseBom = "3.8.0"
ktor = "3.5.1"
serialization = "1.10.0"
coroutines = "1.10.2"
junit = "4.13.2"
detekt = "1.23.8"
ktlintGradle = "14.2.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabaseBom" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
