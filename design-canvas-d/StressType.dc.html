<helmet><style>
    /* ── Little Sprout M1 tokens（值即實作值，ios-dev 直接抄）── */
    :root{
      --ls-board:#F4DFDB; --ls-board-2:#E7CDCB; --ls-board-3:#E2C6BE; --ls-lit:#FBEBE4;
      --ls-ink:#2A1219; --ls-ink-2:#3E232B;
      --ls-cta:#86183F; --ls-cta-deep:#4A0722; --ls-cta-busy:#5E0A2A; --ls-on-cta:#FEF3F0;
      --ls-pen:#7E1414; --ls-sprout:#1C4630; --ls-edge:#8C6159; --ls-google-line:#747775;
      /* 漸層：兩端各自是 token，寫法只有一種（180deg，上→下）。 */
      --ls-g-paper:linear-gradient(180deg, #F8E6DD 0%, #EFD8D9 100%);
      --ls-g-win:linear-gradient(180deg, #E0C4C3 0%, #EED5D2 100%);
      --ls-g-win3:linear-gradient(180deg, #D8B9B1 0%, #E6C9C1 100%);
      --ls-g-face:linear-gradient(180deg, #E9CFC7 0%, #DBBDB5 100%);
      --ls-g-cta:linear-gradient(180deg, #901F49 0%, #7C1236 100%);
      --ls-g-well:linear-gradient(180deg, #866867 0%, #957B7A 100%);
      --ls-g-stub3:linear-gradient(180deg, #FAEADE 0%, #EFD3D6 35%, #ECD0D6 100%);
      --ls-g-stub2:linear-gradient(180deg, #F9EBE0 0%, #F2DAD8 35%, #F1D8D7 100%);
      --ls-g-stub1:linear-gradient(180deg, #F8EBE1 0%, #F5E1DB 35%, #F4E0DB 100%);
      --ls-g-stub0:linear-gradient(180deg, #F7ECE3 0%, #F6E8E1 35%, #F6E8E0 100%);
      --ls-g-seam:linear-gradient(180deg, rgba(42,18,25,0) 0%, rgba(42,18,25,.42) 100%);
      /* 光從哪一邊來（+1 上、−1 下）。G24 讀它決定每一個表面該長什麼樣，
         所以「這一張板是哪一種光」不再靠檔名猜。 */
      --ls-dir:1;
      --ls-r-window:12px; --ls-r-control:14px; --ls-r-card:18px;
      --ls-sp-1:4px; --ls-sp-2:8px; --ls-sp-3:12px; --ls-sp-4:16px;
      --ls-sp-5:24px; --ls-sp-6:32px; --ls-tap-min:44px;
      /* 過期句規線（第 10 輪 D9-02）：粗細與垂直位置，見 tokens.mjs 的 EXPIRED_RULE。 */
      --ls-expired-rule-w:2px; --ls-expired-rule-y:60%;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;-webkit-font-smoothing:antialiased;background:#F4DFDB;color:#2A1219;text-wrap:pretty}
    a{color:#2A1219;text-decoration:underline} a:hover{color:#86183F}
    /* 紙的紋理：卡紙不是純色。全稿唯一用到透明度的地方。 */
    .g::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      mix-blend-mode:multiply}
    /* 過期句劃掉：不用瀏覽器內建 line-through（落在 CJK 橫畫帶，見 tokens.mjs 的
       EXPIRED_RULE 註解）。**不能用 background-image 畫這條線**——量測 probe
       的對比／漸層清冊是逐元素走 backgroundColor／backgroundImage 祖先鏈算的
       （見 _probe.html 的 bgAt()／onGrad()），畫在 <s> 自己的背景上，這條規線
       會被誤判成「這段文字站在一支沒登記的漸層上」（G22③／G23②），而且背景
       原地疊在字底下會把對比直接量成規線色 vs 字色（第 10 輪初版踩過這個坑：
       AAA 從 7.12 掉成 2.68）。改成 ::after 疊在文字**上面**（正常流內容先畫、
       絕對定位的偽元素後畫，天生疊在最上層），regine 用純色 background（不是
       linear-gradient()，掃描才不會誤認），量測祖先鏈只看真的 DOM 元素，
       不會走到偽元素，兩條 gate 都不會被誤觸。粗細／位置一樣出自具名 token。 */
    s[data-expired]{text-decoration:none;color:#3E232B;position:relative}
    s[data-expired]::after{content:"";position:absolute;left:0;right:0;top:var(--ls-expired-rule-y);height:var(--ls-expired-rule-w);background:#8C6159;pointer-events:none}
  </style></helmet>
