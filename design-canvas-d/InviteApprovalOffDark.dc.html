      --ls-ink:#F8E7E2; --ls-ink-2:#DCBEBC;

      /* 漸層：兩端各自是 token，寫法只有一種（180deg，上→下）。 */
      --ls-g-paper:linear-gradient(180deg, #1F1015 0%, #2B1915 100%);
      --ls-g-win:linear-gradient(180deg, #251417 0%, #180B0E 100%);
      --ls-g-win3:linear-gradient(180deg, #3F2626 0%, #2E1A1A 100%);
      --ls-g-face:linear-gradient(180deg, #2E1A1A 0%, #3F2626 100%);
      --ls-g-cta:linear-gradient(180deg, #D998B4 0%, #E9B3CE 100%);
      --ls-g-well:linear-gradient(180deg, #261418 0%, #1D0C10 100%);
      --ls-g-stub3:linear-gradient(180deg, #22131C 0%, #331F1A 35%, #34211A 100%);
      --ls-g-stub2:linear-gradient(180deg, #27171C 0%, #31211C 35%, #32221C 100%);
      --ls-g-stub1:linear-gradient(180deg, #2A1D1C 0%, #30231E 35%, #30231E 100%);
      --ls-g-stub0:linear-gradient(180deg, #2C221F 0%, #2E2420 35%, #2E2420 100%);
      --ls-g-seam:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.62) 100%);
      /* 光從哪一邊來（+1 上、−1 下）。G24 讀它決定每一個表面該長什麼樣，
         所以「這一張板是哪一種光」不再靠檔名猜。 */
      --ls-dir:-1;
      --ls-r-window:12px; --ls-r-control:14px; --ls-r-card:18px;
      --ls-sp-1:4px; --ls-sp-2:8px; --ls-sp-3:12px; --ls-sp-4:16px;
      --ls-sp-5:24px; --ls-sp-6:32px; --ls-tap-min:44px;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;-webkit-font-smoothing:antialiased;background:#261416;color:#F8E7E2;text-wrap:pretty}
    a{color:#F8E7E2;text-decoration:underline} a:hover{color:#E3A9C4}
    /* 紙的紋理：卡紙不是純色。全稿唯一用到透明度的地方。 */
    .g::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.09;

      mix-blend-mode:multiply}
  </style></helmet>
