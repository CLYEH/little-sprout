<helmet><style>
    /* ── Little Sprout M1 tokens（值即實作值，ios-dev 直接抄）── */
    :root{
      --ls-board:#F4DFDB; --ls-board-2:#E7CDCB; --ls-board-3:#E2C6BE; --ls-lit:#FEF3F0;
      --ls-ink:#2A1219; --ls-ink-2:#3E232B;
      --ls-cta:#86183F; --ls-cta-deep:#4A0722; --ls-cta-busy:#5E0A2A; --ls-on-cta:#FEF3F0;
      --ls-pen:#7E1414; --ls-sprout:#1C4630; --ls-edge:#8C6159; --ls-google-line:#747775;
      /* 漸層：兩端各自是 token，寫法只有一種（180deg，上→下）。 */
      --ls-g-paper:linear-gradient(180deg, #F8E6DD 0%, #EFD8D9 100%);
      --ls-g-win:linear-gradient(180deg, #E0C4C3 0%, #EED5D2 100%);
      --ls-g-win3:linear-gradient(180deg, #D8B9B1 0%, #E6C9C1 100%);
      --ls-g-face:linear-gradient(180deg, #E9CFC7 0%, #DBBDB5 100%);
      --ls-g-cta:linear-gradient(180deg, #901F49 0%, #7C1236 100%);
      --ls-g-stub3:linear-gradient(180deg, #FAEADE 0%, #EFD3D6 35%, #ECD0D6 100%);
      --ls-g-stub2:linear-gradient(180deg, #F9EBE0 0%, #F2DAD8 35%, #F1D8D7 100%);
      --ls-g-stub1:linear-gradient(180deg, #F8EBE1 0%, #F5E1DB 35%, #F4E0DB 100%);
      --ls-g-stub0:linear-gradient(180deg, #F7ECE3 0%, #F6E8E1 35%, #F6E8E0 100%);
      --ls-g-seam:linear-gradient(180deg, rgba(42,18,25,0) 0%, rgba(42,18,25,.42) 100%);
      --ls-r-window:12px; --ls-r-control:14px; --ls-r-card:18px;
      --ls-sp-1:4px; --ls-sp-2:8px; --ls-sp-3:12px; --ls-sp-4:16px;
      --ls-sp-5:24px; --ls-sp-6:32px; --ls-tap-min:44px;
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;-webkit-font-smoothing:antialiased;background:#F4DFDB;color:#2A1219;text-wrap:pretty}
    a{color:#2A1219;text-decoration:underline} a:hover{color:#86183F}
    /* 紙的紋理：卡紙不是純色。全稿唯一用到透明度的地方。 */
    .g::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.055;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      mix-blend-mode:multiply}
  </style></helmet>
<div class="g" data-col="phone" data-grad="paper" style="position:relative;width:390px;height:844px;background:linear-gradient(180deg, #F8E6DD 0%, #EFD8D9 100%);overflow:hidden;display:flex;flex-direction:column">
<div style="padding:59px 24px 0"><div data-s="raise" data-role="link" style="min-height:44px;display:flex;align-items:center;gap:4px;margin-left:-6px;color:#2A1219">
      <span style="display:flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5 8 12l6.5 7"/></svg></span><span style="font-size:17px;line-height:25px;font-weight:600">返回</span>
   </div></div>
<div style="display:flex;flex-direction:column;gap:24px;padding:16px 24px 34px;flex-grow:1">
  <div data-rail="1" style="display:flex;align-items:center;gap:8px">

      <span style="font-size:13px;line-height:18px;font-weight:500;color:#3E232B;letter-spacing:.03em">步驟 1，共 2 步</span>
    </div>
  
  <div style="display:flex;flex-direction:column;gap:8px">

    <p style="font-size:17px;line-height:25px;font-weight:400;color:#3E232B;margin:0">我們會寄一組 6 位數字給你，不用記密碼。</p>

  <div style="display:flex;flex-direction:column;gap:12px">

      </div>
      
    </div>
  <span style="font-size:17px;line-height:25px;font-weight:600;color:#7E1414">這個 Email 少了 @，請再看一次。</span>
  
  <div data-s="flat" style="border:1px solid #8C6159;border-radius:12px;padding:12px 16px">
    <span style="font-size:17px;line-height:25px;font-weight:400;color:#3E232B;text-shadow:0 1px 0 rgba(255,246,242,.80)">信會由「萌芽日記」寄出，主旨是「你的登入數字」。</span>
  </div>

      <span style="display:flex;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 3.4 3.6 10.2l6.6 2.8 2.8 6.6Z"/><path d="m10.2 13 4.2-4.2"/></svg></span>
      <span style="font-size:17px;line-height:25px;font-weight:600;color:#FEF3F0;text-align:center">傳送驗證碼</span>
    </div>
  <span style="font-size:13px;line-height:18px;font-weight:500;color:#3E232B">信通常一分鐘內會到。沒看到的話，找找「垃圾郵件」那一夾，或是回到這裡再按一次。</span>
</div></div>
